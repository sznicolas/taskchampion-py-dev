name: checks

on:
  workflow_call:

jobs:
  clippy:
    runs-on: ubuntu-latest
    name: "Check & Clippy"

    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1" # MSRV
          components: clippy

      - name: Check
        run: cargo check

      - name: Clippy
        run: cargo clippy --all-features --no-deps -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    name: "Rust Formatting"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt
          toolchain: "1.91.1"

      - name: Rustfmt
        run: cargo fmt --all -- --check

  ruff:
    runs-on: ubuntu-latest
    name: "Python Lint & Format (ruff)"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install 'ruff>=0.9.0'

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

  mypy:
    runs-on: ubuntu-latest
    name: "Python Typing"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mypy
        run: pip install 'mypy>=1.10.0' pytest

      - name: Type check
        env:
          MYPYPATH: .
        run: mypy --explicit-package-bases taskchampion.pyi tests/

  audit:
    runs-on: ubuntu-latest
    name: "Security Audit (cargo audit)"
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
