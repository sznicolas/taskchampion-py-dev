[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "taskchampion3-py-dev"
version = "3.0.1.3"
requires-python = ">=3.9"
description = "Python bindings for TaskChampion 3.x (fork, updated for taskchampion=3.0.1)"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
keywords = ["taskwarrior", "taskchampion", "tasks", "productivity"]
authors = [
    {name = "Illya Laifu", email="illyalaifu@gmail.com"},
    {name = "Dustin J. Mitchell", email="dustin@v.igoro.us"},
    {name = "sznicolas", email="sznicolas+@users.noreply.github.com"},
]
license = {file = "LICENSE"}
readme = "README.md"

[project.urls]
homepage = "https://gothenburgbitfactory.org/taskchampion"
repository = "https://github.com/sznicolas/taskchampion-py-dev"
changelog = "https://github.com/sznicolas/taskchampion-py-dev/releases"

[tool.maturin]
features = ["pyo3/extension-module", "server-local"]

[project.optional-dependencies]
test = ["pytest>=8.2.0", "mypy>=1.10.0"]

[tool.ruff]
line-length = 88
target-version = "py39"
extend-exclude = ["target", ".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]  # pytest.raises blocks inspect bare expressions intentionally
